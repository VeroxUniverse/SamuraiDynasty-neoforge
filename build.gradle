plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.61-beta'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
    repositories {
        mavenLocal()
        maven { url 'https://maven.azuredoom.com/mods' }
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }
        maven {
            url 'https://www.cursemaven.com'
            content {
                includeGroup "curse.maven"
            }
        }
        maven { url = "https://jitpack.io" }
        maven {
            name = "SmartBrainLib (SBL) Maven Repo"
            url = "https://dl.cloudsmith.io/public/tslat/sbl/maven/"
        }
        maven {
            name = "Iron's Maven - Release"
            url = "https://code.redspace.io/releases"
        }
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://maven.enginehub.org/repo/" }
        maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
        maven { url = "https://maven.theillusivec4.top" }
        maven { url = "https://maven.kosmx.dev/" }
        maven { url = "https://maven.jt-dev.tech/releases" }
        maven { url = "https://maven.jt-dev.tech/snapshots" }
    }

    dependencies {

        //implementation "net.neoforged:neoforge:${neo_version}"

        implementation "mod.azure.azurelib:azurelib-neo-${minecraft_version}:${azurelib_version}"

        // JEI
        compileOnly "mezz.jei:jei-1.21-common-api:${jei_version}"
        compileOnly "mezz.jei:jei-1.21-neoforge-api:${jei_version}"
        runtimeOnly "mezz.jei:jei-1.21-neoforge:${jei_version}"

        runtimeOnly "curse.maven:jade-324717:5884231"

        // Curios
        //implementation "curse.maven:adorned-1036809:5546365"
        implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
        runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

        // Better Combat
        runtimeOnly "maven.modrinth:better-combat:2.0.2+1.21.1-neoforge"
        runtimeOnly "curse.maven:cloth-config-348521:5623420"
        runtimeOnly "curse.maven:playeranimator-658587:5698755"

        //Terrablender
        implementation "curse.maven:terrablender-neoforge-940057:5864140"

        //OhTheTreesYoullGrow
        implementation "dev.corgitaco:Oh-The-Trees-Youll-Grow-neoforge:${minecraft_version}-${ohthetreesyoullgrow_version}"


        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
        runtimeOnly "curse.maven:worldedit-225608:5830452"
    }

    tasks.withType(ProcessResources).configureEach {
        var replaceProperties = [
                minecraft_version                : minecraft_version,
                minecraft_version_range          : minecraft_version_range,
                neo_version                      : neo_version,
                neo_version_range                : neo_version_range,
                loader_version_range             : loader_version_range,
                mod_id                           : mod_id,
                mod_name                         : mod_name,
                mod_license                      : mod_license,
                mod_version                      : mod_version,
                mod_authors                      : mod_authors,
                mod_description                  : mod_description,
                azurelib_version_range           : azurelib_version_range,
                curios_version_range             : curios_version_range,
                terrablender_version_range       : terrablender_version_range,
                ohthetreesyoullgrow_version_range: ohthetreesyoullgrow_version_range
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/neoforge.mods.toml']) {
            expand replaceProperties
        }
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven {
                url "file://${project.projectDir}/repo"
            }
        }
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }